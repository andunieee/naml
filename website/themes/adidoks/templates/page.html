{% extends "base.html" %}

{% block title %}{{ page.title }} {{ config.extra.title_separator }} {{ config.title }}{% endblock title %}
{% block body_class %}page single{% endblock body_class %}

{% block content %}
<div class="wrap container" role="document">
  <div class="content">
    <div class="row justify-content-center">
      <div class="col-md-12 col-lg-10 col-xxl-8">
        <article>
          <div class="page-header"><h1>{{ page.title }}</h1></div>
          {{ page.content | safe }}
        </article>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
