[package]
name = "nam"
version = "0.1.0"
edition = "2024"
description = "nostr app manager: install, update and integrate portable linux apps (AppImages, static binaries, archives) discovered over nostr"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
backhand = { version = "0.25", default-features = false, features = ["xz", "gzip", "zstd"] }
bzip2 = "0.6"
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
dialoguer = { version = "0.12", default-features = false }
dirs = "6"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
indicatif = "0.18"
md4 = "0.10"
orangedb = { path = "../orangedb/orangedb" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
ritualistic = { version = "0.2.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
url = "2"
liblzma = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"

[profile.release]
lto = "thin"
strip = true
