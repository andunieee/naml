name: docs

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time, and don't cancel one halfway
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # the theme's templates are ported to tera 2, which zola uses since 0.23
  ZOLA_VERSION: "0.23.6"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install zola
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" zola
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/zola" --version

      - id: pages
        uses: actions/configure-pages@v5

      - name: build
        working-directory: website
        run: |
          zola check --skip-external-links
          zola build --base-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
